# Scenario 9: a debugging shortcut hard-codes a scratch catalog and reaches prod.
# Prod jobs then read/write the wrong catalog and fail with TABLE_OR_VIEW_NOT_FOUND.
name: hardcoded_catalog
expected_error: TABLE_OR_VIEW_NOT_FOUND or wrong data
commit_message: "chore: simplify table config"
edits:
  - file: notebooks/transform_silver.py
    find: 'catalog = dbutils.widgets.get("catalog")'
    replace: 'catalog = "dev_scratch"'
  - file: notebooks/build_gold.py
    find: 'catalog = dbutils.widgets.get("catalog")'
    replace: 'catalog = "dev_scratch"'
